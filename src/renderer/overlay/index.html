<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' pack: http://localhost:* ws://localhost:*; img-src 'self' pack: data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' pack: http://localhost:* ws://localhost:*">
  <title>overlay</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    /* Anchored top-left, not bottom: place() in main.ts computes an absolute offset from
       the window origin, and a transform is measured from where the element already sits.
       With bottom: 0 the two stacked, which sank him 24 px at rest and pushed him clean
       below the window for the whole of a flight, when the window grows to span both
       displays. That was the cross-display "blip": he was clipped out, not teleported. */
    #buddy { position: absolute; left: 0; top: 0; will-change: transform; }
    /* An idle thought bubble. Positioned the same way as #buddy (an absolute offset from
       the window origin via transform); main.ts decides above-his-head vs beside him and
       toggles the side-* class that aims the two trailing "thought" circles at him. */
    #mutter {
      position: absolute; left: 0; top: 0;
      max-width: 390px;
      padding: 12px 15px;
      border-radius: 18px;
      background: rgba(10, 14, 18, 0.86);
      color: #e8f1f2;
      font: 20px system-ui;
      border: 1px solid rgba(255, 255, 255, 0.18);
      pointer-events: none;
      opacity: 0;
      transition: opacity 300ms;
    }
    #mutter.visible { opacity: 1; }
    #mutter::before, #mutter::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(10, 14, 18, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    #mutter::before { width: 12px; height: 12px; }
    #mutter::after { width: 8px; height: 8px; }
    /* Bubble sits above him: circles trail down toward his head. */
    #mutter.side-above::before { bottom: -21px; left: 28%; }
    #mutter.side-above::after { bottom: -33px; left: 20%; }
    /* Bubble sits to his left: circles trail right toward him. */
    #mutter.side-left::before { right: -21px; bottom: 9px; }
    #mutter.side-left::after { right: -33px; bottom: -5px; }
    /* Bubble sits to his right: circles trail left toward him. */
    #mutter.side-right::before { left: -21px; bottom: 9px; }
    #mutter.side-right::after { left: -33px; bottom: -5px; }
  </style>
</head>
<body><canvas id="buddy"></canvas><div id="mutter" hidden></div><script type="module" src="./main.ts"></script></body>
</html>
